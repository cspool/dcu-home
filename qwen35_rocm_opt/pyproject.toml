[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen35-rocm-opt"
version = "0.1.0"
description = "Host-independent gfx936 kernels and runtime helpers for Qwen3.5"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "triton>=3.2"]

[tool.setuptools]
packages = ["qwen35_rocm_opt", "qwen35_rocm_opt.profiles"]
package-dir = {qwen35_rocm_opt = "."}
include-package-data = true

[tool.setuptools.package-data]
qwen35_rocm_opt = ["profiles/*.csv", "csrc/*.cpp", "csrc/*.cu"]
